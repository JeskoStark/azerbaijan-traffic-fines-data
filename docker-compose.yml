services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fines}
      POSTGRES_USER: ${POSTGRES_USER:-student}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-student} -d ${POSTGRES_DB:-fines}"]
      interval: 3s
      timeout: 3s
      retries: 20
  loader:
    build: .
    env_file: .env
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
